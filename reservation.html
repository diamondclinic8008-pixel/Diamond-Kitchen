<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="reservation.css">
</head>
<body>
     </section>
                <section class="reservation section" id="reservation">
            <div class="section-heading">
                <p class="eyebrow">YOUR TABLE AWAITS</p>
                <h2>Book a Table</h2>
                <p>Fill in your details to request a reservation.</p>
            </div>
            <form id="reservation-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter you email" required>
                <label for="date"></label>Reservation Date</label>
                <input type="date" id="date" name="date" required>
                <label for="guest">Number of Guests</label>
                <select id="guests" name="guests" required>
                    <option value="1">1 guest</option>
                    <option value="2">2 guest</option>
                    <option value="3">3 guest</option>
                    <option value="4">4 guest</option>
                    <option value="5">5 guest</option>
                    <option value="6">6 guest</option>
                    <option value="7">7 guest</option>
                    <option value="8">8 guest</option>
                    <option value="9">9 guest</option>
                    <option value="10">10 guest</option>
                </select>
                <button type="submit" class="btn">Request Reservation</button>
                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
</body>
</html>
